<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梦核游乐园 · 点击探索</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">

    <!-- 场景：图片 + 透明热点层 + 额外效果层 -->
    <div id="scene-container">
      <img id="scene-image" alt="场景图片">
      <div id="hotspot-layer"></div>
      <div id="shadow-extra" class="hidden">多出来的影子</div>
      <div id="glitch-text"></div>
    </div>

    <!-- 左上角：返回按钮 -->
    <button id="back-button" class="hidden" type="button">← 返回</button>

    <!-- 右上角：重新开始按钮 -->
    <button id="restart-button" type="button">重新开始</button>

    <!-- 顶部中间：声音开关 -->
    <button id="sound-button" type="button">声音：开</button>

    <!-- 右下角：显示热区（调试核对用） -->
    <button id="debug-button" type="button">显示热区</button>

    <!-- 左下角：已获得道具 -->
    <div id="inventory-indicator" class="hidden"></div>

    <!-- 左下角：已发现的密码线索 -->
    <div id="clues-indicator" class="hidden"></div>

    <!-- 底部字幕（主行 + 小字行） -->
    <div id="subtitle"></div>
    <div id="subtitle-sub"></div>

    <!-- 游戏结束标记 -->
    <div id="game-over-badge" class="hidden">游戏结束</div>

    <!-- 结局全屏层（点击推进） -->
    <div id="overlay" class="hidden">
      <div id="overlay-text" class="hidden"></div>
      <div id="overlay-small" class="hidden"></div>
      <img id="overlay-image" class="hidden" alt="结局图片">
      <div id="overlay-caption" class="hidden"></div>
    </div>

    <!-- 小游戏弹层（黑色 / 灰绿色 / 米白色） -->
    <div id="mini-game-overlay" class="hidden">
      <div id="mini-game-panel">
        <div id="mini-game-header">
          <span id="mini-game-title"></span>
          <button id="mini-game-close" type="button" aria-label="关闭">✕</button>
        </div>
        <div id="mini-game-prompt"></div>
        <div id="mini-game-body"></div>
        <div id="mini-game-message"></div>
      </div>
    </div>

    <!-- 精神降维：背景变暗层 -->
    <div id="dim-overlay" class="hidden"></div>

    <!-- 精神降维：提示框 -->
    <div id="alert-modal" class="hidden">
      <p id="alert-text">你似乎感觉哪里不一样了</p>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
